# The return for fixing (decisions N and R). Reusable: a repository calls it on workflow_run
# of its judge workflow, type completed, and on issue_comment, type created.
# No job here has actions: write. That permission could delete runs and artifacts,
# and those are evidence.
name: feedback

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: quality.toml
      prompt-file:
        type: string
        default: prompts/executor.md
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      EXECUTOR_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  decide:
    name: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      act: ${{ steps.decision.outputs.act }}
      head-sha: ${{ steps.decision.outputs.head-sha }}
      pr: ${{ steps.decision.outputs.pr }}
      head-ref: ${{ steps.decision.outputs.head-ref }}
      allowed-bots: ${{ steps.decision.outputs.allowed-bots }}
    env:
      PYTHONPATH: ${{ github.workspace }}/.gate
      GATE_TOKEN: ${{ github.token }}
      GATE_CONFIG: ${{ github.workspace }}/.trusted/${{ inputs.config-path }}
      GATE_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Get the gate at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gate
          persist-credentials: false

      - name: Get the configuration from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"

      - name: Check this job's environment
        env:
          GATE_PROBE_TOKEN: ${{ github.token }}
        run: python -P -m gate.env_check --role feedback --config "$GATE_CONFIG"

      - name: Get the stored runs
        run: bash .gate/scripts/get_stored_runs.sh .trusted "$GITHUB_WORKSPACE/.stored"

      - name: Decide
        id: decision
        run: |
          python -P -m gate.archive check-actors --api-repo "$GITHUB_REPOSITORY" --branch reports --config "$GATE_CONFIG" --out actors.json || true
          python -P -m gate.publish pulls --out pulls.json
          python -P -m gate.publish review-statuses --event-name "$GATE_EVENT_NAME" --event "$GITHUB_EVENT_PATH" --out statuses.json
          python -P -m gate.feedback decide --event-name "$GATE_EVENT_NAME" --event "$GITHUB_EVENT_PATH" --pulls pulls.json --statuses statuses.json --actors actors.json --reports-dir .stored/reports --config "$GATE_CONFIG" --out decision.json
          python -P -m gate.feedback outputs --decision decision.json --config "$GATE_CONFIG" --output "$GITHUB_OUTPUT" --note note/comment.txt

      - name: Say what was decided and why
        if: ${{ steps.decision.outputs.post == 'true' }}
        env:
          GATE_PR: ${{ steps.decision.outputs.pr }}
        run: python -P -m gate.publish comment --pr "$GATE_PR" --body note/comment.txt

      - name: Keep the note for the fix round
        if: ${{ steps.decision.outputs.act == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-fix-note
          path: note/
          retention-days: 30

  fix:
    name: fix
    needs: decide
    if: ${{ needs.decide.outputs.act == 'true' }}
    # One fix at a time per PR. The executor then rechecks the head, so a queued one stops.
    concurrency:
      group: gate-fix-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/executor.yml
    with:
      config-path: ${{ inputs.config-path }}
      prompt-file: ${{ inputs.prompt-file }}
      pr-number: ${{ needs.decide.outputs.pr }}
      head-ref: ${{ needs.decide.outputs.head-ref }}
      expected-head: ${{ needs.decide.outputs.head-sha }}
      allowed-bots: ${{ needs.decide.outputs.allowed-bots }}
      fix-note-artifact: gate-fix-note
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EXECUTOR_APP_PRIVATE_KEY: ${{ secrets.EXECUTOR_APP_PRIVATE_KEY }}
