# The gate's own tests, on the pinned runner (decision T). No secrets.
name: self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"

      - name: Install the test tools, with hashes
        run: python -m pip install --quiet --require-hashes -r locks/test.lock

      - name: make check
        run: make check

      - name: actionlint
        run: |
          bash scripts/install_actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          # This actionlint is older than the job.workflow_* context, and takes it as unknown.
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color -ignore 'property "workflow_(repository|sha)" is not defined' .github/workflows/*.yml
