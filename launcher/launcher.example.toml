# The launcher's configuration. Copy it as launcher.toml beside xtl_launcher.py, in a folder the
# executor's user can read but not change (see INSTRUCTION-CEO.md, step 5), and replace every <...>.

[launcher]
# Written by the setup script (setup/setup_apps.py), readable only by the executor's user.
key_file = '<key folder>\<executor app name>.pem'
app_file = '<key folder>\<executor app name>.app.json'

# The executor's own working folder: clones, logs, one virtual environment per run.
runs_dir = '<executor profile folder>\xtl-runs'

# Claude Code, signed in for this Windows user. On Windows give the full path to claude.exe:
# the plain ["claude"] does not start there.
claude_command = ['<executor profile folder>\.local\bin\claude.exe']

# The Python that makes each run's virtual environment for the application's tests.
app_python = '<full path to python.exe 3.13>'

# Claude's deny rules: the model's file tools may not read these (defence in depth).
deny_read_paths = ['<operator profile folder>', '<key folder>', '<any other folder to keep from the model>']

# Folders this user must not be able to open. If one can be opened, the launcher stops before the model.
must_not_open = ['<a folder the executor must not open>']

# Stage A (LAUNCHER-CONTRACT.md, LR-53 to LR-56): the ledger of attempts, and the limits on the
# model's messages. The ledger is a full drive path outside every repository; the launcher creates
# its folder. Stage A's values are 80 messages per attempt, 240 per task and 3 attempts per task.
ledger_file = '<executor profile folder>\xtl-ledger\ledger.jsonl'
max_messages_attempt = 80
max_messages_task = 240
max_runs_task = 3

# Optional. Outside tests the only values allowed are these defaults, and for repo_url
# 'https://github.com/<owner>/<repository>.git' as the app file names it.
api_url = "https://api.github.com"
gate_url = "https://github.com/XThoughtLabs/quality-gate.git"
